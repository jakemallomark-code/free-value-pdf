<!DOCTYPE html>

    <style>
        * {

        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            flex-direction: column;
        }

        .container {
            text-align: center;
            max-width: 700px;
            padding: 40px;
        }

        h1 {

            margin-bottom: 20px;
        }

        p {

            margin-bottom: 35px;
            color: #d1d5db;
        }

        button {
            padding: 18px 40px;
            font-size: 22px;
            border: none;
            border-radius: 50px;
            background: #22c55e;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .modal {
            display: none;
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
        }

        .popup {
            background: white;
            color: black;
            padding: 30px;
            border-radius: 15px;
            width: 320px;
            text-align: center;
        }

        .popup h2 {
            margin-bottom: 20px;
        }

        .option {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
